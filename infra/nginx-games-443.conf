# PlayForFun на 443 для playfofun.duckdns.org
# API: 3001, WS: 3002, Web: Static

server {
    listen 80;
    server_name playfofun.duckdns.org 95.111.246.161;
    return 301 https://$host$request_uri;
}

server {
    listen 127.0.0.1:14443 ssl;
    server_name playfofun.duckdns.org 95.111.246.161;

    ssl_certificate     /etc/letsencrypt/live/playfofun.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playfofun.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WebSocket server
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location = /api/livekit-token {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API server
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LiveKit signaling (path-based reverse proxy)
    # Docker: 7882:7880, LIVEKIT_URL=wss://playfofun.duckdns.org/livekit
    location /livekit/ {
        proxy_pass http://127.0.0.1:7882/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Marzban subscription proxy: отдаём /sub/* через :443, чтобы клиентам
    # в РФ не ходить на нестандартный :9443 (часто режется провайдерами/ТСПУ).
    # ВАЖНО: этот блок обязан стоять ДО location /, иначе SPA-try_files
    # поймает путь раньше и отдаст index.html.
    location /sub/ {
        proxy_pass https://127.0.0.1:9443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name playfofun.duckdns.org;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # PlayForFun VPN client — статика самообновления (version.txt, .exe, .sha256).
    # Каталог вне SPA-dist, чтобы редеплой web не стирал релизы. Стоит ДО
    # location / по той же причине, что и /sub/ (иначе вернётся index.html).
    location /update/ {
        alias /var/www/pff-update/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
    }

    # Static Web app
    location ~* ^/(assets|css|sounds)/ {
        root /home/gamesadmin/games-hub/apps/web/dist;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        root /home/gamesadmin/games-hub/apps/web/dist;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        root /home/gamesadmin/games-hub/apps/web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    error_log /var/log/nginx/games-hub-443-error.log;
    access_log /var/log/nginx/games-hub-443-access.log;
}
